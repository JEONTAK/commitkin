# Copy to YOUR_LOGIN/YOUR_LOGIN/.github/workflows/commitkin-profile-sync.yml.
# Replace the reviewed SHA placeholder. No schedule, push hook or other trigger.
name: Commitkin profile display preview

"on":
  workflow_dispatch:
    inputs:
      source_repository:
        description: Your public Commitkin fork (YOUR_LOGIN/commitkin)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: commitkin-profile-display
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preview the profile block without publishing
        uses: JEONTAK/commitkin/profile-sync@<reviewed-40-character-commit-sha>
        with:
          token: ${{ github.token }}
          source-repository: ${{ inputs.source_repository }}
          dry-run: 'true'

# To intentionally sync a previously published fork snapshot later, change this
# job's contents permission to write AND dry-run to 'false'. This writes README
# only and never writes the fork or calculates/changes growth. No PAT required.
