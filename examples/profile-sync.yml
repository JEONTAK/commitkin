# Example only. Prefer the personalized code in your successful setup Summary.
# Replace your-login/commitkin once if using this example directly.
# Generated by Commitkin. Commit this file in your profile repository once.
name: Commitkin profile

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: Preview changes or publish the saved character
        type: choice
        options: [preview, publish]
        default: preview
      connect_if_missing:
        description: First connection only; append a missing block without replacing existing content
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: commitkin-profile-display
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ inputs.mode == 'preview' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: JEONTAK/commitkin/profile-sync@6539f0219ff5e49de831025b1432984318853808
        with:
          source-repository: 'your-login/commitkin'
          initialize-if-missing: ${{ inputs.connect_if_missing }}
          dry-run: 'true'
  publish:
    if: ${{ inputs.mode == 'publish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: JEONTAK/commitkin/profile-sync@6539f0219ff5e49de831025b1432984318853808
        with:
          source-repository: 'your-login/commitkin'
          initialize-if-missing: ${{ inputs.connect_if_missing }}
          dry-run: 'false'
