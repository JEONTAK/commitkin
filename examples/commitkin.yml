# SPDX-License-Identifier: MIT
# Included in every new fork. Manual choices only; no YAML edits or timers.
name: Set up Commitkin

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: Preview without writes, or save/update your character
        type: choice
        options: [preview, save]
        default: preview
      faction:
        description: First use only; leave empty after any saved snapshot
        type: choice
        options: ['', bloomguard, ashbound]
        default: ''
      confirm_faction:
        description: First save only; faction becomes permanent even if analysis is pending
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: commitkin-fork
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ inputs.mode == 'preview' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out this fork at the requested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Preview without saving
        uses: ./setup
        with:
          mode: preview
          faction: ${{ inputs.faction }}
          confirm-faction: ${{ inputs.confirm_faction }}
  save:
    if: ${{ inputs.mode == 'save' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./setup
        with:
          mode: save
          faction: ${{ inputs.faction }}
          confirm-faction: ${{ inputs.confirm_faction }}
