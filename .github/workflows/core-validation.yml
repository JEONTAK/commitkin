# SPDX-License-Identifier: MIT
name: Read-only core validation

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commitkin-readonly-core-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the requested source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-15
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, resolved 2026-10-15
        with:
          node-version: '24'
      - name: Install pinned dependencies without lifecycle scripts
        run: |
          npm --prefix packages/record-validator ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/commitkin ci --ignore-scripts --no-audit --no-fund
      - name: Validate record baseline and local core
        run: |
          npm --prefix packages/record-validator test
          npm --prefix packages/commitkin run test:coverage
      - name: Exercise fictional preview generation only
        run: |
          node packages/commitkin/bin/commitkin.mjs demo --faction bloomguard --name ci-bloomguard
          node packages/commitkin/bin/commitkin.mjs demo --faction ashbound --name ci-ashbound
      - name: Verify the built-in token through the actual read-only adapter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node packages/commitkin/bin/commitkin-readonly-probe.mjs
      - name: Verify observed-source reads and unsettled-day file acquisition without writing growth
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node packages/commitkin/bin/commitkin-observed-probe.mjs
      - name: Check no live growth record was created
        run: |
          test ! -e .commitkin
          test ! -e .github/commitkin.yml
          git diff --exit-code -- README.md .commitkin .github/commitkin.yml
